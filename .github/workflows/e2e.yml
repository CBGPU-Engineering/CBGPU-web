name: E2E (not a deploy gate)
# Slow browser scenarios and the portable-container build. They do not run on every push and never block a
# deploy: the fast CI workflow gates releases. They run nightly, on pull requests and on demand.
on:
  schedule:
    - cron: '0 18 * * *'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - name: Cold authentication link regression
        run: CBGPU_BROWSER_QA=1 node --test tests/auth-flow-link.browser.test.mts
      - name: Queued job dropdown above modal
        run: node tests/manufacturing/queue-select-browser.mts
      - name: School scope loading and permission isolation
        run: node tests/schools/scope-loading-browser.mts
      - name: Persistence and private-result UI regression
        run: |
          node tests/polls-editor-atomic.browser.mts
          node tests/polls-response-atomic.browser.mts
          node tests/polls-read-recovery.browser.mts
          node tests/polls-mutation-ack.browser.mts
          node tests/materials-uncertain-upload.browser.mts
          node tests/ui/admin-alert-language.browser.mts
          node tests/ui/oil-ui-controls.browser.mts
          node tests/ui/portal-action-contrast.browser.mts
          node tests/polls-scale-ui.browser.mts
          node tests/tech-news-race.browser.mts
          node tests/dropdown-events.browser.mts
          node tests/select-menu-width.browser.mts
          CBGPU_SIGNUP_MEMBERSHIP_BROWSER=1 node --test tests/school-signup-membership.browser.test.mts
      - name: Browser demo
        id: browser_demo
        run: |
          node scripts/demo.mts --built > /tmp/demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" || true; cat /tmp/demo.log' EXIT
          node tests/schools/ai-effort-focus-browser.mts
          node scripts/demo-smoke.mts
          CBGPU_OIL_NAV_ORIGIN=http://localhost:3100 node tests/ui/oil-ui-navigation.browser.mts
          CBGPU_CONTRAST_ORIGIN=http://localhost:3100 node tests/services-contrast.browser.mts
          CBGPU_ARCADE_TEST_ORIGIN=http://localhost:3100 node tests/arcade-browser.mts
          CBGPU_NOTES_TEST_ORIGIN=http://localhost:3100 node tests/notes-persistence.browser.mts
          CBGPU_FRONTEND_AUDIT_ORIGIN=http://localhost:3100 node tests/frontend-journey-audit.browser.mts
          node scripts/study-session-smoke.mts
          node scripts/app-update-smoke.mts
          node scripts/hybrid-navigation-smoke.mts
          node scripts/ai-smoke.mts
      - name: GPU extension and admin reservation history
        run: |
          node scripts/gpu-extension-preview.mts --build
          node scripts/gpu-extension-preview.mts > /tmp/gpu-extension-demo.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true; cat /tmp/gpu-extension-demo.log' EXIT
          node tests/gpu-reservation-extension.browser.mts
          node tests/admin-reservation-history.browser.mts
      - name: AI demo failure diagnostics
        if: failure() && steps.browser_demo.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-demo-failure-${{ github.run_attempt }}
          path: |
            /tmp/cbgpu-ai-smoke-failure.json
            /tmp/cbgpu-ai-smoke-failure.png
          if-no-files-found: ignore
          retention-days: 3

  portable-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build source-only review image
        run: >-
          docker build
          --build-arg CBGPU_RELEASE_SHA=${{ github.sha }}
          --build-arg NEXT_PUBLIC_SUPABASE_URL=https://cbgpu.com/backend
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=synthetic-public-ci-key
          --tag cbgpu-web:portable-candidate .
      - name: Verify isolated runtime and graceful shutdown
        run: node scripts/container-smoke.mts
