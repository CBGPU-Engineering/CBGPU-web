name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - name: Browser demo
        run: |
          node scripts/demo.mjs --built > /tmp/demo.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" || true; cat /tmp/demo.log' EXIT
          node scripts/demo-smoke.mjs
          node scripts/app-update-smoke.mjs
      - run: node scripts/check-publication.mjs
      - run: npm sbom --sbom-format cyclonedx --omit=dev > /tmp/web-sbom.cdx.json
