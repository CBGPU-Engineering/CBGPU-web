name: Feature request
description: Suggest an improvement for students, researchers or maintainers.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Who needs this, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
