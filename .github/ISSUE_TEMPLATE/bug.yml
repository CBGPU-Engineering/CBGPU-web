name: Bug report
description: Report a reproducible problem using non-sensitive examples.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For vulnerabilities use SECURITY.md. Never include passwords or student data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the affected service, app version, browser and OS.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Use synthetic accounts. Remove tokens and personal information.
