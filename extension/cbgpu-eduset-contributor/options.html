<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBGPU 기여자 설정</title><style>
body{font-family:system-ui,sans-serif;width:360px;margin:0;padding:20px;background:#111;color:#eee}h1{font-size:19px;margin:0 0 8px}p{font-size:13px;color:#aaa;line-height:1.5}label{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #444;border-radius:8px;background:#1b1b1b;color:#fff}button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;background:#1687d9;color:#fff;font-weight:800;cursor:pointer}.status{margin-top:12px;padding:10px;border-radius:8px;background:#1b1b1b;font-size:12px;word-break:break-all}.ok{color:#57d68d}.error{color:#ff7676}a{color:#65b8f3}

<button id="save">저장</button><div id="status" class="status">설정을 확인하는 중...</div>
